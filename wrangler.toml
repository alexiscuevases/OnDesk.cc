name = "pulse"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "pulse-db"
database_id = "59eb1987-dd3a-49c7-add0-b69e87869ed4"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "pulse-storage"

[ai]
binding = "AI"

# Run: wrangler vectorize create ondesk-tickets --dimensions=384 --metric=cosine
# Run: wrangler vectorize create ondesk-messages --dimensions=384 --metric=cosine
# Run: wrangler vectorize create ondesk-contacts --dimensions=384 --metric=cosine
# Run: wrangler vectorize create ondesk-companies --dimensions=384 --metric=cosine

[[vectorize]]
binding = "VECTORIZE_TICKETS"
index_name = "ondesk-tickets"

[[vectorize]]
binding = "VECTORIZE_MESSAGES"
index_name = "ondesk-messages"

[[vectorize]]
binding = "VECTORIZE_CONTACTS"
index_name = "ondesk-contacts"

[[vectorize]]
binding = "VECTORIZE_COMPANIES"
index_name = "ondesk-companies"

# Run: wrangler vectorize create ondesk-memories --dimensions=384 --metric=cosine
[[vectorize]]
binding = "VECTORIZE_MEMORIES"
index_name = "ondesk-memories"

# Run: wrangler vectorize create ondesk-kb --dimensions=384 --metric=cosine
[[vectorize]]
binding = "VECTORIZE_KB"
index_name = "ondesk-kb"

# ── Marketplace connector credentials ─────────────────────────────────────────
# CREDENTIALS_SECRET is the master key used to derive the AES-256-GCM key that
# encrypts each workspace's third-party API credentials (workspace_products.
# credentials). Falls back to JWT_SECRET when unset.
#
#   wrangler pages secret put CREDENTIALS_SECRET --project-name pulse
#   wrangler pages secret put CREDENTIALS_SECRET --project-name pulse --env preview
#
# Set on both environments (they share one D1 database, so they must share the
# key). NEVER rotate it: stored credentials become undecryptable and every
# workspace admin has to re-enter their tokens. See docs/marketplace.md.

# ── Email (Cloudflare Email Sending) ──────────────────────────────────────────
# Pages Functions do not support the `send_email` Workers binding, so we call the
# Email Sending REST API instead:
#
#   POST /accounts/{CF_ACCOUNT_ID}/email/sending/send
#
# 1. Onboard the sending domain (adds SPF + DKIM records):
#
#      wrangler email sending enable pulse.ondesk.cc
#      wrangler email sending dns get pulse.ondesk.cc     # verify propagation
#
# 2. Create an account-scoped API token with permission to send email, then:
#
#      wrangler pages secret put EMAIL_API_TOKEN --project-name pulse
#      wrangler pages secret put CF_ACCOUNT_ID   --project-name pulse
#      wrangler pages secret put EMAIL_FROM      --project-name pulse   (e.g. no-reply@pulse.ondesk.cc)
#
# EMAIL_FROM_NAME is optional and defaults to "OnDesk". The EMAIL_FROM domain
# must be the onboarded one, or sends fail with a sender-not-verified error.

# ── Stripe secrets ────────────────────────────────────────────────────────────
# Set these via: wrangler secret put <KEY>
#
#   STRIPE_SECRET_KEY                      sk_live_...
#   STRIPE_WEBHOOK_SECRET                  whsec_...
#   STRIPE_STARTER_MONTHLY_PRICE_ID        price_...
#   STRIPE_STARTER_ANNUAL_PRICE_ID         price_...
#   STRIPE_CORE_MONTHLY_PRICE_ID           price_...
#   STRIPE_CORE_ANNUAL_PRICE_ID            price_...
#   STRIPE_ENTERPRISE_MONTHLY_PRICE_ID     price_...
#   STRIPE_ENTERPRISE_ANNUAL_PRICE_ID      price_...
